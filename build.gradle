import javax.inject.Inject
import org.apache.tools.ant.filters.ReplaceTokens
import org.gradle.process.ExecOperations

plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'java'
}

interface RuntimeFetchServices {
    @Inject
    ExecOperations getExecOperations()
}

def baseVersion = providers.gradleProperty('mod_version').get()
def buildTimestamp = java.time.ZonedDateTime.now(java.time.ZoneOffset.UTC)
        .format(java.time.format.DateTimeFormatter.ofPattern("yyyyMMddHHmm"))
def gitShortHash = providers.exec { commandLine 'git', 'rev-parse', '--short=7', 'HEAD' }
        .standardOutput.asText.map { it.trim() }
// Ignore untracked build outputs; wrapper sources are tracked with the mod.
def gitDirty = providers.exec {
    commandLine 'git', 'status', '--porcelain', '--untracked-files=no'
}.standardOutput.asText.map { it.trim().isEmpty() ? '' : '-dirty' }

// The default artifact covers both CPUs on Linux and Windows. Native production
// is explicit; Java compilation and tests never invoke a host compiler.
def supportedArches = ['linux64', 'linuxarm64', 'win64', 'arm64']
def archProperty = project.findProperty('arch')
if (archProperty && !(archProperty in supportedArches)) {
    throw new GradleException("Invalid -Parch=${archProperty}; use ${supportedArches.join(', ')}")
}
def buildArches = archProperty ? [archProperty] : supportedArches
def isSingleArchJar = archProperty != null
logger.lifecycle("Build target arches: ${buildArches.join(', ')}")

def archSuffix = isSingleArchJar ? "-${archProperty}" : ''
version = "${baseVersion}-${buildTimestamp}-${gitShortHash.get()}${gitDirty.get()}${archSuffix}"
def resolvedBuildVersion = version.toString()
group = 'com.nvidia.rtxremix'
def benchmarkJfrPath = providers.gradleProperty("benchmarkJfrPath")
def benchmarkQuickPlayWorld = providers.gradleProperty("benchmarkQuickPlayWorld")
def benchmarkTracyJavaMaxDepth = providers.gradleProperty("benchmarkTracyJavaMaxDepth").orElse("6")
def benchmarkJfrThrowables = providers.gradleProperty("benchmarkJfrThrowables")
        .orElse(providers.environmentVariable("RTX_BENCHMARK_JFR_THROWABLES"))
        .orElse("false")

// Shared exclusion rules for both setupRuntime and packageJar.
//   - Strip dxvk PDBs (~100MB), keep remixbridge.pdb (small, useful for debugging)
//   - Drop NvRemixBridge.exe / .pdb (32-bit game bridge, unused in MC Java;
//     avoids naming confusion with remixbridge.dll, our JNI shim)
ext.sdkExclusions = { details ->
    def name = details.name
    if (name == 'NvRemixBridge.exe' || name == 'NvRemixBridge.pdb') return true
    if (name.endsWith('.pdb') && name != 'remixbridge.pdb') return true
    return false
}

base {
    archivesName = 'rtx-remix-renderer'
}
def projectArchiveName = base.archivesName.get()

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

// Minecraft 26.x requires Java 25
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

// Compile the integrated Java wrapper alongside the mod.
sourceSets {
    main {
        java {
            srcDir 'rtxremix-java/src'
        }
    }
}

loom {
    accessWidenerPath = file("src/main/resources/rtx-remix-renderer.accesswidener")

    runs {
        client {
            // Keep in sync with RECOMMENDED_JVM_ARGS in packaging/installer.ps1.
            // Minecraft Launcher 1.21.1 defaults for supported Windows arches:
            // version metadata supplies HeapDumpPath; the profile supplies G1.
            vmArgs "-Xmx2G", "-XX:+UnlockExperimentalVMOptions", "-XX:+UseG1GC",
                   "-XX:G1NewSizePercent=20", "-XX:G1ReservePercent=20",
                   "-XX:MaxGCPauseMillis=50", "-XX:G1HeapRegionSize=32M",
                   "-XX:HeapDumpPath=MojangTricksIntelDriversForPerformance_javaw.exe_minecraft.exe.heapdump"
            if (benchmarkJfrPath.isPresent()) {
                def jfrPath = benchmarkJfrPath.get().replace('\\', '/')
                // maxsize=0 lifts JDK 21's 250 MB default disk cap so a long
                // recording keeps its earliest frames.
                def jfrRecording = "name=rtx-benchmark,settings=profile,disk=true,dumponexit=false,maxsize=0"
                if (benchmarkJfrThrowables.get().toBoolean()) {
                    jfrRecording += ",jdk.JavaExceptionThrow#enabled=true,jdk.JavaExceptionThrow#stackTrace=true"
                    jfrRecording += ",jdk.JavaErrorThrow#enabled=true,jdk.JavaErrorThrow#stackTrace=true"
                }
                vmArgs "-Drtxremix.benchmark.jfrPath=${jfrPath}",
                       "-Drtxremix.profile.javaPhases=true",
                       "-Drtxremix.profile.tracyJavaMaxDepth=${benchmarkTracyJavaMaxDepth.get()}",
                       "-XX:FlightRecorderOptions=stackdepth=256",
                       "-XX:StartFlightRecording=${jfrRecording}"
            }
            if (benchmarkQuickPlayWorld.isPresent()) {
                programArgs "--quickPlaySingleplayer", benchmarkQuickPlayWorld.get()
            }
            // Optional --username passthrough for runClient.
            if (project.hasProperty('mcUsername')) {
                programArgs "--username", project.property('mcUsername')
            }
            // Set Remix's graphics preset for this runClient launch only:
            // `gradlew runClient -PrtxPreset=high`.
            if (project.hasProperty('rtxPreset')) {
                vmArgs "-Drtxremix.preset=${project.property('rtxPreset')}"
            }
            // Join a multiplayer server directly on launch (debugging aid):
            // `gradlew runClient -PmcQuickPlayServer=localhost:25565`
            if (project.hasProperty('mcQuickPlayServer')) {
                programArgs "--quickPlayMultiplayer", project.property('mcQuickPlayServer')
            }
            runDir "run"
        }
    }
}

// Fabric API (keep in sync with FABRIC_API_VERSION in packaging/installer.ps1,
// which is what gets installed at runtime on the user's machine). One literal
// serves both the compile dependency and stageFabricApi.
def fabricApiCoordinate = "net.fabricmc.fabric-api:fabric-api:0.165.2+26.3"
def fabricLoaderVersion = "0.19.5"

configurations {
    fabricTestRuntime {
        extendsFrom testRuntimeClasspath
    }
}

dependencies {
    // Minecraft and Fabric
    minecraft "com.mojang:minecraft:26.3"
    implementation "net.fabricmc:fabric-loader:${fabricLoaderVersion}"

    implementation fabricApiCoordinate
    include(fabricApiCoordinate) { transitive = false }

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    fabricTestRuntime "net.fabricmc:fabric-loader-junit:${fabricLoaderVersion}"
}

// Indigo needs Minecraft registries and Fabric's runtime access transformations.
// Keep those separate from the plain JVM tests, which inspect untransformed classes.
def fabricTest = tasks.register('fabricTest', Test) {
    group = 'verification'
    description = 'Runs renderer integration tests under Fabric Loader.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath - configurations.testRuntimeClasspath +
            configurations.fabricTestRuntime
    useJUnitPlatform {
        includeTags 'fabric'
    }
    systemProperty 'fabric.side', 'client'
}

test {
    dependsOn fabricTest
    useJUnitPlatform {
        excludeTags 'fabric'
    }
    // Pin the per-frame install cap so tests don't depend on the CPU count
    systemProperty 'rtxremix.chunk.maxInstalledColumnsPerFrame', '8'
}

def gitBranch = providers.exec { commandLine 'git', 'rev-parse', '--abbrev-ref', 'HEAD' }
        .standardOutput.asText.map { it.trim() }

// Embed the exact compiled native source contract, derived from the copied
// header rather than assuming a permanent API patch or vtable extent.
def nativeSourceList = file('packaging/native-bundles/source-files.txt')
def nativeSources = nativeSourceList.readLines().findAll { !it.isBlank() }
def nativeContractDir = layout.buildDirectory.dir('generated/native-contract')
def generateNativeContract = tasks.register('generateNativeContract') {
    inputs.file(nativeSourceList)
    inputs.files(nativeSources.collect { file("rtxremix-java/native/${it}") })
    outputs.dir(nativeContractDir)
    doLast {
        def header = file('rtxremix-java/native/include/remix_c.h')
        def text = header.getText('UTF-8')
        def versionParts = ['MAJOR', 'MINOR', 'PATCH'].collect { part ->
            def found = text =~ /#define REMIXAPI_VERSION_${part}\s+(\d+)/
            if (!found.find()) throw new GradleException("Missing C API version ${part}")
            found.group(1)
        }
        def table = text =~ /(?s)typedef\s+struct\s+remixapi_Interface\s*\{(.*?)\}\s*remixapi_Interface\s*;/
        if (!table.find()) throw new GradleException('Cannot identify the C API interface contract')
        def body = table.group(1).replaceAll(/(?s)\/\*.*?\*\//, '').replaceAll(/(?m)\/\/.*$/, '')
        def fieldPattern = /PFN_\w+\s+\w+\s*;/
        def pointers = (body =~ fieldPattern).count
        if (!body.replaceAll(fieldPattern, '').isBlank() || pointers == 0) {
            throw new GradleException('Unknown C API interface layout: update the source contract parser')
        }
        def hash = { File input ->
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            input.withInputStream { stream ->
                byte[] buffer = new byte[65536]
                int n
                while ((n = stream.read(buffer)) != -1) digest.update(buffer, 0, n)
            }
            digest.digest().encodeHex().toString()
        }
        def sourcesHash = java.security.MessageDigest.getInstance('SHA-256')
        nativeSources.each { name ->
            sourcesHash.update((name + '\n' + hash(file("rtxremix-java/native/${name}")) + '\n').getBytes('UTF-8'))
        }
        def output = new File(nativeContractDir.get().asFile, 'native-source.properties')
        output.parentFile.mkdirs()
        output.text = "api=${versionParts.join('.')}\nbridgeAbi=source-v1\ninterfacePointers=${pointers}\n" +
                "headerSha256=${hash(header)}\nbridgeSourceSha256=${sourcesHash.digest().encodeHex()}\n"
    }
}
sourceSets.main.resources.srcDir(nativeContractDir)

processResources {
    dependsOn generateNativeContract
    // Repository-only asset notes contain relative links, not runtime resources.
    exclude 'README.md'
    inputs.property "version", resolvedBuildVersion
    inputs.property "gitShortHash", gitShortHash
    inputs.property "gitBranch", gitBranch

    filesMatching("fabric.mod.json") {
        expand "version": resolvedBuildVersion
    }
    filesMatching("benchmark.properties") {
        expand "gitCommit": gitShortHash.get(), "gitBranch": gitBranch.get()
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 25
    options.headerOutputDirectory.set(layout.buildDirectory.dir('generated/jni'))
    options.compilerArgs += ["-Xmaxerrs", "20000"]
}

def isLinuxHost = System.getProperty("os.name", "").toLowerCase().contains("linux")
def armHost = System.getProperty("os.arch", "").toLowerCase(java.util.Locale.ROOT) in ["aarch64", "arm64"]
def currentRuntimeArch = isLinuxHost ? (armHost ? "linuxarm64" : "linux64") : (armHost ? "arm64" : "win64")
def runtimeArch = archProperty ?: currentRuntimeArch
def runtimeSdkDir = "remix-runtime/${runtimeArch}"
def runtimeBridgeDir = "build/native/${runtimeArch}"

// Fetch only the runtime consumed by each task. Existing directories, especially
// local snapshots, belong to the developer; Gradle never replaces or updates them.
def runtimeFetchServices = objects.newInstance(RuntimeFetchServices)
def runtimeManifest = file('packman/remix-sdk.packman.xml')
def packmanDirectory = file('packman')
def runtimeFetchDirectory = layout.projectDirectory.asFile
def fetchRuntimeSdkTasks = ['win64', 'arm64'].collectEntries { arch ->
    def targetDir = file("remix-runtime/${arch}")
    def fetchTask = tasks.register(arch == 'win64' ? 'fetchRuntimeSdkWin64' : 'fetchRuntimeSdkArm64') {
        description = "Fetches the pinned ${arch} runtime when it is not staged"
        group = 'build'
        onlyIf {
            !new File(targetDir, '.local-sdk-source').exists() && !targetDir.directory
        }
        doLast {
            def projectXml = new groovy.xml.XmlParser().parse(runtimeManifest)
            def dependency = projectXml.dependency.find { it.attribute('name') == "remix-sdk-${arch}" }
            if (dependency == null) {
                throw new GradleException("Dependency 'remix-sdk-${arch}' not found in ${runtimeManifest}")
            }
            // Packman resolves linkPath relative to its input manifest. Keep the
            // staging path lexical so an existing junction is never its cache target.
            dependency.attributes()['linkPath'] = targetDir.absolutePath.replace('\\', '/')
            def filtered = new Node(null, 'project', [toolsVersion: '7.6'])
            filtered.append(dependency)
            def temporaryManifest = File.createTempFile('.packman-fetch-', '.tmp.xml', runtimeFetchDirectory)
            try {
                temporaryManifest.setText(groovy.xml.XmlUtil.serialize(filtered), 'UTF-8')
                logger.lifecycle("Pulling remix-sdk-${arch} -> ${targetDir}")
                runtimeFetchServices.execOperations.exec {
                    workingDir packmanDirectory
                    commandLine 'cmd', '/d', '/c', new File(packmanDirectory, 'packman.cmd').absolutePath,
                            'pull', temporaryManifest.absolutePath, '-p', 'windows-x86_64'
                }
            } finally {
                temporaryManifest.delete()
            }
        }
    }
    [(arch): fetchTask]
}

// The Linux runtime has no published package. It is built natively from dxvk-remix and staged locally with
// tools/stage_linux_runtime.sh, so the "fetch" only checks that staging happened.
def checkLinuxRuntimeTask = tasks.register('checkLinuxRuntimeStaged') {
    description = 'Fails with the staging command when remix-runtime/linux64 is missing'
    group = 'build'
    doLast {
        if (!file('remix-runtime/linux64/libremixapi.so').exists()) {
            throw new GradleException("The Linux runtime is not staged. Build dxvk-remix natively, then run:\n" +
                "  tools/stage_linux_runtime.sh [dxvk-remix checkout] [dxvk-deps directory]")
        }
    }
}
fetchRuntimeSdkTasks['linux64'] = checkLinuxRuntimeTask
fetchRuntimeSdkTasks['linuxarm64'] = tasks.register('checkLinuxArm64RuntimeStaged') {
    doLast {
        if (!file('remix-runtime/linuxarm64/libremixapi.so').isFile()) {
            throw new GradleException('Stage a matching Linux ARM64 runtime in remix-runtime/linuxarm64 first.')
        }
    }
}

// Dev run/ keeps full SDK contents including PDBs so debugger sessions against
// a locally-built (possibly debug-flavor) dxvk can resolve symbols. packageJar
// still strips SDK PDBs for distribution. Bridge copies inside the SDK directory
// stay excluded so the freshly-built build/native/{arch} copy wins.
def syncRuntimeSdkTask = tasks.register('syncRuntimeSdk', Sync) {
    dependsOn fetchRuntimeSdkTasks[runtimeArch]
    dependsOn([win64: 'compileNativeWin64', arm64: 'compileNativeArm64', linux64: 'compileNativeLinux', linuxarm64: 'compileNativeLinuxArm64'][runtimeArch])
    doFirst {
        // Sync treats a missing `from` dir as empty and would silently strip
        // run/remix-sdk down to just the bridge DLL. Fail with the fix instead.
        if (!file(runtimeSdkDir).directory) {
            throw new GradleException(
                "Remix SDK directory '${runtimeSdkDir}' is missing. To use a local runtime override:\n" +
                "  .\\tools\\rtx.bat sdk local --arch ${runtimeArch} --path <dir>\n" +
                "docs/GETTING_STARTED.md#get-a-runtime describes local staging.")
        }
    }
    from(runtimeSdkDir) {
        exclude 'remixbridge.dll', 'remixbridge.pdb', 'remixbridge.so'
    }
    from(runtimeBridgeDir) {
        include 'remixbridge.dll', 'remixbridge.pdb', 'remixbridge.so'
    }
    into 'run/remix-sdk'
}

// A plain task rather than Copy: a Copy into 'run' declares the whole run directory as
// its output, so Gradle fingerprinted every file under it (saves, logs, the runtime's
// open session files) on each build, and a file a still-exiting client held open
// failed the build with "Failed to create MD5 hash".
def copyRuntimeConfigTask = tasks.register('copyRuntimeConfig') {
    def source = file('packaging/rtx.conf')
    def target = file('run/rtx.conf')
    inputs.file(source)
    outputs.file(target)
    doLast {
        target.parentFile.mkdirs()
        java.nio.file.Files.copy(source.toPath(), target.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    }
}

// Runtime DDS assets are loaded from MinecraftClient.runDirectory; stage them
// for runClient so development uses the production texture paths. They live
// in Packman, not git: remix-runtime/textures/ is the junction packman creates
// from packman/textures.packman.xml, and a pull at the pinned version is a
// local no-op once the package is in the shared cache. Like the runtime
// junctions beside it, it sits where git has never tracked a file, so no
// checkout can write or delete through it into the cache.
def runtimeTexturesDir = 'remix-runtime/textures'
// The files the mod loads from <gameDir>/textures/ (SkyRenderer and
// BlockTextureManager), which the distributable JAR carries for
// NativeExtractor and the installer's uninstall removes.
def runtimeTextureFiles = ['overcast_thunderstorm_bc6u.dds', 'water_normals_flipbook.dds']
def fetchRuntimeTexturesTask = tasks.register('fetchRuntimeTextures', Exec) {
    description = 'Pulls the runtime textures pinned in packman/textures.packman.xml'
    group = 'build setup'
    def manifest = file('packman/textures.packman.xml')
    inputs.file(manifest)
    // A relative script path from its own folder: cmd /c strips the outer
    // quotes of a quoted script path, which splits a checkout path containing
    // spaces, and cmd skips the current folder for a bare name when
    // NoDefaultCurrentDirectoryInExePath is set.
    workingDir file('packman')
    if (isLinuxHost) {
        commandLine 'bash', './packman', 'pull', manifest.absolutePath
    } else {
        commandLine 'cmd', '/d', '/c', '.\\packman.cmd', 'pull', manifest.absolutePath
    }
    def legacyLink = file('packaging/textures').toPath()
    def texturesDir = file(runtimeTexturesDir)
    doFirst {
        // Earlier builds linked packaging/textures/, which older commits track,
        // so checking one out wrote and deleted files in the shared cache.
        // Remove that junction, which never touches its target; leave a real
        // directory alone.
        def noFollow = java.nio.file.LinkOption.NOFOLLOW_LINKS
        if (java.nio.file.Files.exists(legacyLink, noFollow)
                && java.nio.file.Files.readAttributes(legacyLink,
                        java.nio.file.attribute.BasicFileAttributes, noFollow).isOther()) {
            java.nio.file.Files.delete(legacyLink)
            logger.lifecycle('Removed the old runtime-textures junction at packaging/textures')
        }
    }
    doLast {
        // Packman trusts its install marker, so a cache entry that has lost its
        // files still pulls cleanly.
        def missing = runtimeTextureFiles.findAll { name ->
            def texture = new File(texturesDir, name)
            !texture.isFile() || texture.length() == 0
        }
        if (!missing.isEmpty()) {
            def cache = texturesDir.exists() ? texturesDir.toPath().toRealPath().toString() : texturesDir.path
            throw new GradleException("The runtime textures at ${cache} are missing ${missing.join(', ')}. " +
                    'Delete that folder and build again, and Packman downloads the package afresh.')
        }
    }
}

fetchRuntimeTexturesTask.configure {
    inputs.file('src/main/resources/runtime-textures.properties')
    doLast {
        def inventory = new Properties()
        file('src/main/resources/runtime-textures.properties').withInputStream { inventory.load(it) }
        runtimeTextureFiles.each { name ->
            def texture = new File(file(runtimeTexturesDir), name)
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            texture.withInputStream { input ->
                byte[] buffer = new byte[65536]
                int n
                while ((n = input.read(buffer)) != -1) digest.update(buffer, 0, n)
            }
            if (inventory.getProperty(name) != texture.length() + ':' + digest.digest().encodeHex().toString()) {
                throw new GradleException("Runtime texture size/SHA-256 mismatch: ${name}")
            }
        }
    }
}

def syncRuntimeTexturesTask = tasks.register('syncRuntimeTextures', Sync) {
    dependsOn fetchRuntimeTexturesTask
    from runtimeTexturesDir
    into 'run/textures'
}

def migrateDevelopmentResourcePacksTask = tasks.register('migrateDevelopmentResourcePacks', Exec) {
    // The migration removes legacy pack copies that only Windows installs ever had.
    onlyIf { !isLinuxHost }
    commandLine 'powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass',
            '-File', file('packaging/migrate_resource_packs.ps1').absolutePath,
            '-McDir', file('run').absolutePath, '-LegacyPackName', 'rtx-remix'
}

// The mod acquires its conf option-layers from
// <gameDir>/rtx-remix/mods/minecraft-logic/confs/ at runtime; sync the conf
// payload there for dev runs. The runtime also writes logs/ and captures/
// under run/rtx-remix, and the Toolkit may save other mods under mods/;
// preserve those, but keep our payload dir fully Sync-owned so stale files
// never linger.
def syncRuntimeRemixModsTask = tasks.register('syncRuntimeRemixMods', Sync) {
    from 'packaging/rtx-remix'
    into 'run/rtx-remix'
    preserve {
        include 'logs/**'
        include 'captures/**'
        include 'mods/**'
        exclude 'mods/minecraft-logic/**'
    }
}

tasks.register('setupRuntime') {
    description = 'Syncs SDK, configs, textures, and Remix mods into run/ for local dev'
    group = 'build'
    dependsOn syncRuntimeSdkTask, copyRuntimeConfigTask, syncRuntimeTexturesTask,
            syncRuntimeRemixModsTask, migrateDevelopmentResourcePacksTask
}

tasks.named('runClient') {
    dependsOn 'setupRuntime'
}

// A development launcher instance loads mods as a player's install does, so it
// needs the published intermediary jar, not Loom's remapped copy. A detached,
// non-transitive configuration resolves exactly the pinned coordinate and keeps
// this task free of the native build and runtime staging.
tasks.register('stageFabricApi', Copy) {
    description = 'Copies the pinned Fabric API jar to build/dev/ for development launcher instances'
    group = 'build'
    from configurations.detachedConfiguration(dependencies.create(fabricApiCoordinate)).tap { transitive = false }
    into layout.buildDirectory.dir('dev')
    rename { 'fabric-api.jar' }
}

// build_native.bat writes the bridge to build/native/{win64|arm64}/, NOT into
// remix-runtime/{arch}/ (a managed SDK directory is a junction into a shared cache,
// so writing there would mutate every workspace pointing at it).
// setupRuntime/packageJar below layer the bridge on top of the SDK at copy time.
tasks.register('compileNativeWin64', Exec) {
    description = 'Compiles remixbridge.dll for x64 (Windows x86_64)'
    group = 'build'
    workingDir file('rtxremix-java/native')
    commandLine 'cmd', '/c', file('rtxremix-java/native/build_native.bat').absolutePath, 'x64'
    inputs.files file('rtxremix-java/native/build_native.bat'),
                 file('rtxremix-java/native/remixbridge.cpp'),
                 file('rtxremix-java/native/voxel_dag.h'),
                 file('rtxremix-java/native/voxel_dag.cpp'),
                 file('rtxremix-java/native/voxel_dag_jni.cpp'),
                 fileTree('rtxremix-java/native/third_party/miniz'),
                 file('rtxremix-java/native/include/remix_c.h')
    outputs.files file('build/native/win64/remixbridge.dll'),
                  file('build/native/win64/remixbridge.pdb')
}

tasks.register('compileNativeArm64', Exec) {
    description = 'Compiles remixbridge.dll for arm64 (Windows ARM64, cross-compiled)'
    group = 'build'
    workingDir file('rtxremix-java/native')
    commandLine 'cmd', '/c', file('rtxremix-java/native/build_native.bat').absolutePath, 'arm64'
    inputs.files file('rtxremix-java/native/build_native.bat'),
                 file('rtxremix-java/native/remixbridge.cpp'),
                 file('rtxremix-java/native/voxel_dag.h'),
                 file('rtxremix-java/native/voxel_dag.cpp'),
                 file('rtxremix-java/native/voxel_dag_jni.cpp'),
                 fileTree('rtxremix-java/native/third_party/miniz'),
                 file('rtxremix-java/native/include/remix_c.h')
    outputs.files file('build/native/arm64/remixbridge.dll'),
                  file('build/native/arm64/remixbridge.pdb')
}

// Linux native bridge (POSIX / ELF). Counterpart of build_native.bat; uses
// build_native.sh with g++/clang. The bridge shares remixbridge.cpp, which is
// guarded for both platforms. syncRuntimeSdk and packageJar depend on it for -Parch=linux64.
tasks.register('compileNativeLinux', Exec) {
    description = 'Compiles remixbridge.so for Linux (x86_64 ELF)'
    group = 'build'
    workingDir file('rtxremix-java/native')
    commandLine 'bash', file('rtxremix-java/native/build_native.sh').absolutePath, 'x64'
    inputs.files file('rtxremix-java/native/build_native.sh'),
                 file('rtxremix-java/native/remixbridge.cpp'),
                 file('rtxremix-java/native/voxel_dag.h'),
                 file('rtxremix-java/native/voxel_dag.cpp'),
                 file('rtxremix-java/native/voxel_dag_jni.cpp'),
                 fileTree('rtxremix-java/native/third_party/miniz'),
                 file('rtxremix-java/native/include/remix_c.h')
    outputs.files file('build/native/linux64/remixbridge.so')
}

jar {
    from("LICENSE") {
        rename { "${it}_${projectArchiveName}" }
    }
    from("NOTICE") {
        rename { "${it}_${projectArchiveName}" }
    }
    from("THIRD_PARTY_NOTICES.md") {
        rename { "THIRD_PARTY_NOTICES_${projectArchiveName}.md" }
    }
}

// A single manifest binds each bundle to the runtime API, bridge ABI, source
// revisions, hashes, file inventory and platform contract. Missing platforms are
// release blockers. The portable Java build retains their explicit unavailable status.
def nativeManifest = file('packaging/native-bundles/manifest.properties')
def nativeBundleDir = providers.gradleProperty('nativeBundlesDir')
        .map { file(it) }.orElse(layout.buildDirectory.dir('native-bundles').map { it.asFile })
def verifyNativeBundles = tasks.register('verifyNativeBundles', JavaExec) {
    group = 'verification'
    description = 'Verifies all selected precompiled native bundles; never compiles natives'
    dependsOn 'classes'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.nvidia.rtxremix.minecraft.NativeBundles'
    maxHeapSize = '256m'
    args 'verify', nativeManifest.absolutePath, nativeBundleDir.get().absolutePath,
            buildArches.join(','), projectDir.absolutePath
}

def verifyNativeBootstrap = tasks.register('verifyNativeBootstrap', JavaExec) {
    group = 'verification'
    description = 'Checks the portable native bootstrap contract without fetching or compiling native code'
    dependsOn 'classes'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.nvidia.rtxremix.minecraft.NativeBundles'
    maxHeapSize = '256m'
    args 'bootstrap', nativeManifest.absolutePath
}

def verifyFabricApi = tasks.register('verifyFabricApi') {
    def api = configurations.detachedConfiguration(dependencies.create(fabricApiCoordinate))
    api.transitive = false
    inputs.files(api)
    doLast {
        def hash = java.security.MessageDigest.getInstance('SHA-256')
        api.singleFile.withInputStream { input ->
            byte[] buffer = new byte[65536]
            int count
            while ((count = input.read(buffer)) != -1) hash.update(buffer, 0, count)
        }
        if (hash.digest().encodeHex().toString() != '2612a078a5daa06d9a14cabad40fe66de36b8cb22ee8cdf346d5d9894478c392') {
            throw new GradleException('Fabric API 0.165.2+26.3 SHA-256 mismatch')
        }
    }
}

def remapJarTask = tasks.named('jar')
remapJarTask.configure {
    dependsOn verifyFabricApi
    archiveClassifier.set('dev')
    destinationDirectory.set(layout.buildDirectory.dir('intermediates'))
}
tasks.named('sourcesJar') {
    dependsOn generateNativeContract
    destinationDirectory.set(layout.buildDirectory.dir('intermediates'))
}

def packageJarTask = tasks.register('packageJar', Zip) {
    description = 'Assembles the portable Fabric mod JAR with custom bindings and verified bootstrap metadata'
    group = 'build'
    dependsOn remapJarTask, verifyNativeBootstrap, fetchRuntimeTexturesTask
    archiveBaseName.set(projectArchiveName)
    archiveVersion.set(resolvedBuildVersion)
    archiveExtension.set('jar')
    archiveFileName.set("${projectArchiveName}-${archProperty ?: 'universal'}.jar")
    destinationDirectory.set(layout.buildDirectory.dir('libs'))
    duplicatesStrategy = DuplicatesStrategy.FAIL
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    zip64 = true
    from({ zipTree(remapJarTask.get().archiveFile.get().asFile) })
    from(nativeManifest) { into 'native'; rename { 'manifest.properties' } }
    buildArches.each { arch ->
        from(nativeBundleDir.map { new File(it, "${arch}.zip") }) { into 'native/bundles' }
    }
    from('packaging/rtx.conf') { into 'native' }
    from('packaging/rtx-remix') { into 'native/rtx-remix' }
    from('packaging/licenses') { into 'packaging/licenses' }
    from(runtimeTexturesDir) { into 'native/textures'; include runtimeTextureFiles }
}
def packageJarArchive = packageJarTask.flatMap { it.archiveFile }
def verifyPackageJarTask = tasks.register('verifyPackageJar', JavaExec) {
    description = 'Checks the portable mod JAR, nested Fabric API and any bundled native inventories'
    group = 'verification'
    dependsOn packageJarTask
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.nvidia.rtxremix.minecraft.NativeBundles'
    maxHeapSize = '256m'
    args 'jar', packageJarArchive.get().asFile.absolutePath, buildArches.join(','), projectDir.absolutePath
    doLast {
        def archive = packageJarArchive.get().asFile
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        archive.withInputStream { input ->
            byte[] buffer = new byte[65536]
            int count
            while ((count = input.read(buffer)) != -1) digest.update(buffer, 0, count)
        }
        new File(archive.path + '.sha256').text = digest.digest().encodeHex().toString() + '  ' + archive.name + '\n'
        logger.lifecycle("Portable Fabric mod: ${archive}")
    }
}
tasks.named('build') { dependsOn verifyPackageJarTask }
// Complete distribution readiness is explicit and always covers all four targets.
tasks.register('verifyNativeDistribution', JavaExec) {
    group = 'verification'
    description = 'Strict maintainer gate: require and audit compatible packages for every native target'
    dependsOn verifyPackageJarTask
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.nvidia.rtxremix.minecraft.NativeBundles'
    maxHeapSize = '256m'
    args 'verify', nativeManifest.absolutePath, nativeBundleDir.get().absolutePath,
            'linux64,linuxarm64,win64,arm64', projectDir.absolutePath
}

tasks.register('package') {
    description = 'Alias for the standard installable build'
    group = 'build'
    dependsOn 'build'
}

tasks.register('compileNativeLinuxArm64', Exec) {
    description = 'Explicit maintainer producer for the Linux ARM64 JNI bridge'
    group = 'native production'
    commandLine 'bash', file('rtxremix-java/native/build_native.sh').absolutePath, 'arm64'
    inputs.files fileTree('rtxremix-java/native')
    outputs.file 'build/native/linuxarm64/remixbridge.so'
}

// --- Release content -----------------------------------------------------
// The RTX Remix Materials resource pack and the RTX Remix Showcase World, which
// the release carries. Both are the Packman packages tools/config.json pins for
// development launches and benchmarks, so there is one pin and players and
// developers see the same content. Only release staging depends on these tasks:
// build, test and package never download the world.
def releaseContentConfigFile = file('tools/config.json')
def releaseContentConfig = new groovy.json.JsonSlurper().parse(releaseContentConfigFile)
def materialsVersion = releaseContentConfig.resourcePack.version
def worldVersion = releaseContentConfig.world.version
// The links stay under remix-runtime/, where git has never tracked a file, so a
// checkout cannot write or delete through them into the shared package cache.
def artPackDir = 'remix-runtime/art-pack'
def worldDir = 'remix-runtime/world'
// What Minecraft's pack list shows under the pack's name.
def materialsDescription = 'LabPBR textures by NVIDIA for RTX Remix'

def fetchReleaseContentTask = tasks.register('fetchReleaseContent') {
    description = 'Pulls the pack and world pinned in tools/config.json into remix-runtime/'
    group = 'build setup'
    inputs.file(releaseContentConfigFile)
    doFirst {
        // installer.ps1 finds each zip by name, so a pin its patterns do not match
        // would build a zip the installer silently ignores.
        if (!(materialsVersion ==~ /\d+\.\d+\.\d+/) || !(worldVersion ==~ /v?\d+\.\d+\.\d+/)) {
            throw new GradleException(
                "tools/config.json pins resourcePack.version '${materialsVersion}' and world.version " +
                "'${worldVersion}'. The installer finds the zips by name, so they must read 1.2.3 and " +
                'v1.2.3 (the v is optional).')
        }
    }
    doLast {
        def manifest = new Node(null, 'project', [toolsVersion: '7.6'])
        [
            [name: 'art-pack', link: artPackDir, pkg: releaseContentConfig.resourcePack.package,
                    version: materialsVersion],
            [name: 'world', link: worldDir, pkg: "rtx_remix_minecraft_world_${releaseContentConfig.world.name}",
                    version: worldVersion],
        ].each { pin ->
            // An absolute link path, as the runtime fetch gives, so Packman never
            // resolves it through an existing junction into the cache.
            def dependency = new Node(manifest, 'dependency',
                    [name: pin.name, linkPath: file(pin.link).absolutePath.replace('\\', '/')])
            new Node(dependency, 'package', [name: pin.pkg, version: pin.version])
        }
        def temporaryManifest = File.createTempFile('.packman-fetch-', '.tmp.xml', runtimeFetchDirectory)
        try {
            temporaryManifest.setText(groovy.xml.XmlUtil.serialize(manifest), 'UTF-8')
            logger.lifecycle("Pulling the Materials pack ${materialsVersion} and the showcase world ${worldVersion}")
            runtimeFetchServices.execOperations.exec {
                // A relative script path from its own folder, as fetchRuntimeTextures
                // runs it: cmd /c splits a quoted script path that contains spaces.
                workingDir packmanDirectory
                commandLine 'cmd', '/d', '/c', '.\\packman.cmd', 'pull', temporaryManifest.absolutePath
            }
        } finally {
            temporaryManifest.delete()
        }
        // Minecraft lists a pack only when pack.mcmeta sits at the ZIP's root, and
        // opens a save only when its folder holds a level.dat.
        [[dir: artPackDir, required: 'pack.mcmeta', what: 'pack'],
                [dir: worldDir, required: 'world/level.dat', what: 'world']].each { pin ->
            def root = file(pin.dir)
            if (!new File(root, pin.required).isFile()) {
                def cache = root.exists() ? root.toPath().toRealPath().toString() : root.path
                throw new GradleException("The ${pin.what} at ${cache} has no ${pin.required}. " +
                        'Delete that folder and build again, and Packman downloads the package afresh.')
            }
        }
    }
}

// The zip's pack.mcmeta carries the description above, whatever the pinned
// pack's own says, and keeps the pack_format the pack's authors set.
def materialsPackMetaTask = tasks.register('materialsPackMeta') {
    description = 'Writes the pack.mcmeta the Materials zip carries'
    group = 'build'
    dependsOn fetchReleaseContentTask
    def source = file("${artPackDir}/pack.mcmeta")
    def target = layout.buildDirectory.file('release-content/materials-meta/pack.mcmeta')
    inputs.file(source)
    inputs.property('description', materialsDescription)
    outputs.file(target)
    doLast {
        def meta = new groovy.json.JsonSlurper().parse(source)
        meta.pack.description = materialsDescription
        def output = target.get().asFile
        output.parentFile.mkdirs()
        output.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(meta)) + '\n', 'UTF-8')
    }
}

// Minecraft loads a zipped pack without unpacking it. The README and license
// sit beside pack.mcmeta, which must be at the root for the pack to be listed.
def materialsArchiveTask = tasks.register('materialsArchive', Zip) {
    description = 'Zips the pinned pack as the RTX Remix Materials resource pack'
    group = 'build'
    dependsOn fetchReleaseContentTask
    from(materialsPackMetaTask)
    from(artPackDir) {
        exclude '.packman*'
        exclude 'pack.mcmeta'
        // The pack's README describes PDF guides the package does not carry, so
        // the zip keeps the release's own README, with the license beside it.
        exclude 'README.txt'
        exclude 'LICENSE.txt'
    }
    from('packaging/content/materials/README.txt') {
        filter(ReplaceTokens, tokens: [VERSION: materialsVersion])
    }
    from('packaging/content/LICENSE-CC-BY-4.0.txt') {
        rename { 'LICENSE.txt' }
    }
    archiveFileName.set("RTX-Remix-Materials-${materialsVersion}.zip")
    destinationDirectory.set(layout.buildDirectory.dir('release-content'))
    duplicatesStrategy = DuplicatesStrategy.FAIL
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

// The save folder keeps the name a player sees in Minecraft's world list. Only
// what a first visit needs goes in: the session lock, player data, stats,
// advancements, datapacks, the previous level.dat and Paper's files stay behind.
def worldArchiveTask = tasks.register('worldArchive', Zip) {
    description = 'Zips the pinned world as the RTX Remix Showcase World save'
    group = 'build'
    dependsOn fetchReleaseContentTask
    from("${worldDir}/world") {
        include 'DIM-1/**', 'DIM1/**', 'data/**', 'entities/**', 'poi/**', 'region/**', 'icon.png', 'level.dat'
        into 'NVIDIA RTX Demo'
    }
    from('packaging/content/world/README.txt') {
        filter(ReplaceTokens, tokens: [VERSION: worldVersion])
        into 'NVIDIA RTX Demo'
    }
    from('packaging/content/LICENSE-CC-BY-4.0.txt') {
        rename { 'LICENSE.txt' }
        into 'NVIDIA RTX Demo'
    }
    archiveFileName.set("RTX-Remix-Showcase-World-${worldVersion}.zip")
    destinationDirectory.set(layout.buildDirectory.dir('release-content'))
    duplicatesStrategy = DuplicatesStrategy.FAIL
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

def stageReleaseArchiveTask = tasks.register('stageReleaseArchive', Sync) {
    description = 'Stages the verified JAR, the pack and world zips, and the installer in build/release'
    group = 'build'
    dependsOn 'package', 'verifyNativeDistribution'
    into layout.buildDirectory.dir('release')
    duplicatesStrategy = DuplicatesStrategy.FAIL

    from(packageJarArchive) {
        into 'mods'
    }
    // Both zips stay whole. The installer unpacks the ones a player chooses.
    from(materialsArchiveTask) {
        into 'resourcepacks'
    }
    from(worldArchiveTask) {
        into 'saves'
    }
    from 'packaging/install.bat', 'packaging/installer.ps1',
            'packaging/migrate_resource_packs.ps1', 'packaging/INSTALLER_REFERENCE.md'
    from('packaging/INSTALL.md') {
        rename { 'README.md' }
    }
    // The notices link their license texts by repository path, so the texts
    // keep that path here as they do inside the JAR.
    from 'LICENSE', 'NOTICE', 'THIRD_PARTY_NOTICES.md'
    from('packaging/licenses') {
        into 'packaging/licenses'
    }
}

// The classifier keeps the bundle's name apart from the JAR's in the release.
def releaseArchiveTask = tasks.register('releaseArchive', Zip) {
    description = 'Builds the installer bundle: JAR, pack and world zips, and installer, with the selected platform SDKs'
    group = 'build'
    from(stageReleaseArchiveTask)
    archiveBaseName.set(projectArchiveName)
    archiveVersion.set(resolvedBuildVersion)
    archiveClassifier.set('installer')
    destinationDirectory.set(layout.buildDirectory.dir('distributions'))
    duplicatesStrategy = DuplicatesStrategy.FAIL
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

// The four files a GitHub release carries, and nothing else, so the workflow
// uploads build/release-assets/* without a list of names to keep in step.
// Sync removes a file left behind by a previous version.
tasks.register('stageReleaseAssets', Sync) {
    description = 'Stages the four release files in build/release-assets'
    group = 'build'
    into layout.buildDirectory.dir('release-assets')
    duplicatesStrategy = DuplicatesStrategy.FAIL

    from(packageJarArchive)
    from(materialsArchiveTask)
    from(worldArchiveTask)
    from(releaseArchiveTask)
}
